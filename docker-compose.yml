version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: reading_club_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: reading_club
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - reading_club_network

  redis:
    image: redis:7-alpine
    container_name: reading_club_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - reading_club_network

volumes:
  mysql_data:
  redis_data:

networks:
  reading_club_network:
    driver: bridge
